<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ticore — Domestic Steel &amp; Rebar Trading</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<style>
  :root{ --u: 1px; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; background:#000; }
  body{
    font-family:'Inter', system-ui, sans-serif;
    overflow:hidden;
  }

  .frame{
    position:absolute;
    inset:7.2vh 5vw;
    border-radius:calc(14 * var(--u));
    border:1px solid rgba(255,255,255,.09);
    overflow:hidden;
    background:#000;
  }
  @media (max-width:768px){
    .frame{ inset:10px; }
  }

  canvas#ring{
    position:absolute;
    top:0; left:0;
    display:block;
  }

  /* ---------- nav ---------- */
  .nav{
    position:absolute;
    top:calc(24 * var(--u));
    left:calc(26 * var(--u));
    right:calc(24 * var(--u));
    display:flex;
    align-items:center;
    justify-content:space-between;
    z-index:5;
  }
  .brand{ display:flex; align-items:center; gap:calc(8 * var(--u)); }
  .brand svg{ width:calc(22 * var(--u)); height:calc(22 * var(--u)); display:block; }
  .brand span{
    font-size:calc(17.5 * var(--u));
    font-weight:500;
    color:#fff;
    letter-spacing:-0.01em;
  }
  .nav-right{ display:flex; align-items:center; gap:calc(4 * var(--u)); }
  .pill{
    height:calc(29 * var(--u));
    border-radius:calc(8 * var(--u));
    background:rgba(150,150,150,.38);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    display:flex;
    align-items:center;
    gap:calc(22 * var(--u));
    padding-inline:calc(18 * var(--u));
  }
  .pill a{
    color:#fff;
    text-decoration:none;
    font-size:calc(14 * var(--u));
    white-space:nowrap;
    opacity:.92;
  }
  .pill a:hover{ opacity:1; }
  .connect-btn{
    height:calc(29 * var(--u));
    border-radius:calc(8 * var(--u));
    background:#fff;
    color:#141414;
    font-weight:500;
    font-size:calc(14 * var(--u));
    display:flex;
    align-items:center;
    padding-inline:calc(16 * var(--u));
    text-decoration:none;
    white-space:nowrap;
    transition:transform .15s ease;
  }
  .connect-btn:hover{ transform:translateY(-1px); }
  @media (max-width:768px){
    .pill{ display:none; }
  }

  /* ---------- headline ---------- */
  .headline{
    position:absolute;
    left:0; right:0;
    top:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    z-index:5;
    pointer-events:none;
  }
  .headline .cta{ pointer-events:auto; }
  .word-row{
    display:flex;
    align-items:flex-start;
    line-height:1;
  }
  .word{
    font-size:min(calc(176 * var(--u)), 22vw);
    font-weight:600;
    letter-spacing:-0.03em;
    line-height:1;
    background:linear-gradient(12deg, #fffaf6 28%, #ffe6d6 46%, #ffbc98 66%, #ff8f62 88%, #ff7a4c);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    white-space:pre;
  }
  .caret{
    width:calc(1.6 * var(--u));
    height:calc(124 * var(--u));
    background:#ffb48c;
    margin-left:calc(7 * var(--u));
    margin-top:calc(26 * var(--u));
    flex-shrink:0;
  }
  .subline{
    margin:0;
    margin-top:calc(26 * var(--u));
    font-size:calc(18 * var(--u));
    line-height:calc(24 * var(--u));
    color:rgba(255,255,255,.92);
    max-width:46ch;
  }
  @media (max-width:768px){
    .subline{ font-size:15px; line-height:21px; }
  }
  .cta{
    margin-top:calc(19 * var(--u));
    display:inline-flex;
    align-items:center;
    height:calc(41 * var(--u));
    padding-inline:calc(17 * var(--u));
    border-radius:calc(10 * var(--u));
    background:#fff;
    color:#141414;
    font-size:calc(15 * var(--u));
    font-weight:500;
    text-decoration:none;
    transition:transform .15s ease, box-shadow .2s ease;
    box-shadow:0 0 0 rgba(255,130,70,0);
  }
  .cta:hover{
    transform:translateY(-2px);
    box-shadow:0 14px 34px rgba(255,120,60,.35);
  }
</style>
</head>
<body>

<div class="frame" id="frame">
  <canvas id="ring"></canvas>

  <nav class="nav">
    <div class="brand">
      <svg viewBox="0 0 32 32" fill="none">
        <path d="M4 6 L14.5 6 L12 13 L6 13 Z" fill="#fff"/>
        <path d="M28 6 L17.5 6 L20 13 L26 13 Z" fill="#fff"/>
        <rect x="13" y="13" width="6" height="13" fill="#fff"/>
      </svg>
      <span>Ticore</span>
    </div>
    <div class="nav-right">
      <div class="pill">
        <a href="#">Rebar</a>
        <a href="#">Framing</a>
        <a href="#">Specs</a>
      </div>
      <a class="connect-btn" href="#">Request Quote</a>
    </div>
  </nav>

  <div class="headline" id="headline">
    <div class="word-row">
      <span class="word" id="word"></span>
      <span class="caret" id="caret"></span>
    </div>
    <p class="subline">Real steel. Real fast.</p>
    <a class="cta" href="#">Request a quote</a>
  </div>
</div>

<script>
(function(){
  "use strict";

  var frameEl = document.getElementById('frame');
  var canvas = document.getElementById('ring');
  var ctx = canvas.getContext('2d');
  var headlineEl = document.getElementById('headline');
  var wordEl = document.getElementById('word');
  var caretEl = document.getElementById('caret');

  var bloomCanvas = document.createElement('canvas');
  var bctx = bloomCanvas.getContext('2d');

  var reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var isRec = new URLSearchParams(location.search).get('rec') === '1';

  var recAnim = null;
  function setupRec(){
    var el = document.createElement('div');
    el.style.position = 'fixed';
    el.style.width = '1px'; el.style.height = '1px';
    el.style.opacity = '0'; el.style.pointerEvents = 'none';
    document.body.appendChild(el);
    recAnim = el.animate(
      [{ transform:'translateX(0px)' }, { transform:'translateX(100000px)' }],
      { duration:100000, easing:'linear', fill:'both' }
    );
    recAnim.pause();
  }
  if (isRec) setupRec();

  function clockSeconds(){
    if (isRec && recAnim) return recAnim.currentTime / 1000;
    return performance.now() / 1000;
  }

  // ---------------- dimensions ----------------
  var dims = { u:1, w:0, h:0, isPhone:false, shiftY:0 };

  function computeDims(){
    var r = frameEl.getBoundingClientRect();
    var isPhone = window.innerWidth < 768;
    var u = isPhone ? (r.width / 600) : Math.min(r.width / 1052, r.height / 754);

    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.max(1, Math.round(r.width * dpr));
    canvas.height = Math.max(1, Math.round(r.height * dpr));
    canvas.style.width = r.width + 'px';
    canvas.style.height = r.height + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    document.documentElement.style.setProperty('--u', u + 'px');

    var shiftY = 0;
    if (isPhone){
      var naturalBottom = (447 + 270) * u;
      shiftY = Math.max(0, (r.height - naturalBottom)) / 2;
    }

    headlineEl.style.top = (447 * u + shiftY) + 'px';
    headlineEl.style.transform = 'translateY(-62%)';

    dims.u = u; dims.w = r.width; dims.h = r.height; dims.isPhone = isPhone; dims.shiftY = shiftY;
  }

  // ---------------- pointer ----------------
  var pointerTarget = { x:0, y:0 };
  var pointerEase = { x:0, y:0 };
  var tiltEase = 0;

  window.addEventListener('pointermove', function(e){
    pointerTarget.x = (e.clientX / window.innerWidth) * 2 - 1;
    pointerTarget.y = (e.clientY / window.innerHeight) * 2 - 1;
  }, { passive:true });

  // ---------------- typewriter ----------------
  var WORDS = ['Steel', 'Rebar', 'Ticore.'];
  var SEGMENTS = (function(){
    var segs = [];
    for (var i = 0; i < WORDS.length; i++){
      var cur = WORDS[i], next = WORDS[(i + 1) % WORDS.length];
      segs.push({
        cur:cur, next:next,
        hold:2.6,
        del:cur.length * 0.07,
        pe:0.25,
        type:next.length * 0.1,
        pf:0.15
      });
    }
    return segs;
  })();
  var TOTAL = SEGMENTS.reduce(function(s, seg){ return s + seg.hold + seg.del + seg.pe + seg.type + seg.pf; }, 0);

  function getDisplayText(t){
    var tt = t % TOTAL;
    for (var i = 0; i < SEGMENTS.length; i++){
      var seg = SEGMENTS[i];
      var segTotal = seg.hold + seg.del + seg.pe + seg.type + seg.pf;
      if (tt < segTotal){
        var x = tt;
        if (x < seg.hold) return seg.cur;
        x -= seg.hold;
        if (x < seg.del){
          var remain = Math.max(0, seg.cur.length - Math.ceil(x / 0.07));
          return seg.cur.slice(0, remain);
        }
        x -= seg.del;
        if (x < seg.pe) return '';
        x -= seg.pe;
        if (x < seg.type){
          var count = Math.min(seg.next.length, Math.ceil(x / 0.1));
          return seg.next.slice(0, count);
        }
        return seg.next;
      }
      tt -= segTotal;
    }
    return WORDS[0];
  }

  function updateTypewriter(t){
    wordEl.textContent = getDisplayText(t);
    var visible = Math.floor(t / 0.55) % 2 === 0;
    caretEl.style.opacity = visible ? '1' : '0';
  }

  // ---------------- ring math ----------------
  function smoothstep(t, a, b){
    t = Math.min(1, Math.max(0, (t - a) / (b - a)));
    return t * t * (3 - 2 * t);
  }

  var N = 196, M = 41;

  function strandPoints(cx, cy, ri, ro, u, ui, k, t, vScale){
    var pts = [];
    for (var j = 0; j < M; j++){
      var q = j / (M - 1);
      var r = ri + (ro - ri) * q;
      var theta = ui + k * Math.pow(1 - q, 4.2) + 0.05 * k * q * q + 0.02 * Math.sin(Math.PI * q) * Math.sin(3 * ui + 0.4 * t);
      pts.push([cx + r * Math.cos(theta), cy + r * Math.sin(theta) * vScale]);
    }
    return pts;
  }

  function drawStrand(cx, cy, ri, ro, u, ui, k, t, vScale){
    var pts = strandPoints(cx, cy, ri, ro, u, ui, k, t, vScale);
    var left = [], right = [];
    for (var j = 0; j < M; j++){
      var q = j / (M - 1);
      var s = smoothstep(q, 0, 0.28);
      var hw = (0.15 + 3.3 * s * (1 - 0.25 * q)) * u;
      var p0 = pts[Math.max(0, j - 1)];
      var p1 = pts[Math.min(M - 1, j + 1)];
      var dx = p1[0] - p0[0], dy = p1[1] - p0[1];
      var len = Math.hypot(dx, dy) || 1;
      dx /= len; dy /= len;
      var nx = -dy, ny = dx;
      left.push([pts[j][0] + nx * hw, pts[j][1] + ny * hw]);
      right.push([pts[j][0] - nx * hw, pts[j][1] - ny * hw]);
    }

    ctx.save();
    ctx.globalCompositeOperation = 'source-over';
    ctx.beginPath();
    ctx.moveTo(left[0][0], left[0][1]);
    for (var a = 1; a < M; a++) ctx.lineTo(left[a][0], left[a][1]);
    for (var b = M - 1; b >= 0; b--) ctx.lineTo(right[b][0], right[b][1]);
    ctx.closePath();
    var bodyGrad = ctx.createLinearGradient(pts[0][0], pts[0][1], pts[M - 1][0], pts[M - 1][1]);
    bodyGrad.addColorStop(0, '#b01e50');
    bodyGrad.addColorStop(0.12, '#9c1236');
    bodyGrad.addColorStop(0.40, '#860c18');
    bodyGrad.addColorStop(0.70, '#9c1a0a');
    bodyGrad.addColorStop(0.90, '#c63c0e');
    bodyGrad.addColorStop(1, '#e85a18');
    ctx.fillStyle = bodyGrad;
    ctx.fill();
    ctx.restore();

    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.lineWidth = 1.45 * u;
    ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(left[0][0], left[0][1]);
    for (var c = 1; c < M; c++) ctx.lineTo(left[c][0], left[c][1]);
    var edgeGrad = ctx.createLinearGradient(left[0][0], left[0][1], left[M - 1][0], left[M - 1][1]);
    edgeGrad.addColorStop(0, 'rgba(255,130,185,.85)');
    edgeGrad.addColorStop(0.08, 'rgba(255,84,138,.95)');
    edgeGrad.addColorStop(0.28, 'rgba(255,56,80,.95)');
    edgeGrad.addColorStop(0.55, 'rgba(255,58,44,.95)');
    edgeGrad.addColorStop(0.80, 'rgba(255,92,36,1)');
    edgeGrad.addColorStop(0.94, 'rgba(255,122,44,1)');
    edgeGrad.addColorStop(1, 'rgba(255,150,70,1)');
    ctx.strokeStyle = edgeGrad;
    ctx.stroke();
    ctx.restore();
  }

  function drawAmbient(cx, cy, ri, ro, u, vScale){
    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(1, vScale);
    var grad = ctx.createRadialGradient(0, 0, ri * 0.88, 0, 0, ro * 1.02);
    grad.addColorStop(0, 'rgba(170,14,50,.35)');
    grad.addColorStop(0.5, 'rgba(120,8,14,.45)');
    grad.addColorStop(1, 'rgba(170,40,6,.4)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(0, 0, ro * 1.03, 0, Math.PI * 2);
    ctx.arc(0, 0, ri * 0.86, 0, Math.PI * 2, true);
    ctx.fill('evenodd');
    ctx.restore();
  }

  function drawHalos(cx, cy, ri, ro, u, vScale){
    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(1, vScale);

    ctx.globalCompositeOperation = 'lighter';
    var g1 = ctx.createRadialGradient(0, 0, ro - 16 * u, 0, 0, ro + 70 * u);
    g1.addColorStop(0, 'rgba(255,120,40,0)');
    g1.addColorStop(0.45, 'rgba(255,120,40,.42)');
    g1.addColorStop(1, 'rgba(255,120,40,0)');
    ctx.fillStyle = g1;
    ctx.beginPath(); ctx.arc(0, 0, ro + 70 * u, 0, Math.PI * 2); ctx.fill();

    var g2 = ctx.createRadialGradient(0, 0, ri * 0.55, 0, 0, ri * 1.05);
    g2.addColorStop(0, 'rgba(255,150,200,0)');
    g2.addColorStop(1, 'rgba(255,150,200,.09)');
    ctx.fillStyle = g2;
    ctx.beginPath(); ctx.arc(0, 0, ri * 1.05, 0, Math.PI * 2); ctx.fill();

    ctx.globalCompositeOperation = 'source-over';
    ctx.strokeStyle = 'rgba(255,140,60,.8)';
    ctx.lineWidth = 1.6 * u;
    ctx.beginPath(); ctx.arc(0, 0, ro, 0, Math.PI * 2); ctx.stroke();

    ctx.restore();
  }

  function drawBloom(cx, cy, ri, ro, u, vScale, k, t){
    var scale = 0.32;
    var bw = Math.max(1, Math.round(dims.w * scale));
    var bh = Math.max(1, Math.round(dims.h * scale));
    if (bloomCanvas.width !== bw || bloomCanvas.height !== bh){
      bloomCanvas.width = bw; bloomCanvas.height = bh;
    }
    bctx.setTransform(scale, 0, 0, scale, 0, 0);
    bctx.clearRect(0, 0, dims.w, dims.h);
    bctx.globalCompositeOperation = 'lighter';
    bctx.lineWidth = 5.3 * u;
    bctx.strokeStyle = 'rgba(255,120,60,.7)';
    for (var i = 0; i < N; i++){
      var ui = (2 * Math.PI * i) / N + spinGlobal;
      bctx.beginPath();
      for (var j = 0; j <= 8; j++){
        var q = j / 8;
        var r = ri + (ro - ri) * q;
        var theta = ui + k * Math.pow(1 - q, 4.2) + 0.05 * k * q * q + 0.02 * Math.sin(Math.PI * q) * Math.sin(3 * ui + 0.4 * t);
        var x = cx + r * Math.cos(theta), y = cy + r * Math.sin(theta) * vScale;
        if (j === 0) bctx.moveTo(x, y); else bctx.lineTo(x, y);
      }
      bctx.stroke();
    }
    bctx.save();
    bctx.translate(cx, cy);
    bctx.scale(1, vScale);
    bctx.lineWidth = 9 * u;
    bctx.strokeStyle = 'rgba(255,130,50,.55)';
    bctx.beginPath(); bctx.arc(0, 0, ro, 0, Math.PI * 2); bctx.stroke();
    bctx.lineWidth = 5 * u;
    bctx.strokeStyle = 'rgba(255,150,200,.5)';
    bctx.beginPath(); bctx.arc(0, 0, ri, 0, Math.PI * 2); bctx.stroke();
    bctx.restore();

    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.filter = 'blur(' + (8 * u) + 'px)';
    ctx.drawImage(bloomCanvas, 0, 0, bw, bh, 0, 0, dims.w, dims.h);
    ctx.restore();
  }

  var spinGlobal = 0;

  function ringFrame(t){
    var u = dims.u, w = dims.w, h = dims.h;
    ctx.clearRect(0, 0, w, h);

    var ri = 435 * u, ro = 652 * u;
    var spin = 0.06 * t;
    spinGlobal = spin;
    var k = 0.42 * (1 + 0.12 * Math.sin(0.55 * t));

    pointerEase.x += (pointerTarget.x * 14 * u - pointerEase.x) * 0.05;
    pointerEase.y += (pointerTarget.y * 10 * u - pointerEase.y) * 0.05;
    tiltEase += (pointerTarget.y * 0.035 - tiltEase) * 0.05;
    var vScale = 1.03 + tiltEase;

    var cx = w / 2 + 34 * u + pointerEase.x;
    var cy = -212 * u + dims.shiftY + pointerEase.y;

    var order = [];
    for (var i = 0; i < N; i++){
      var ui = (2 * Math.PI * i) / N + spin;
      var a = (ui + Math.PI / 2) % (2 * Math.PI);
      if (a < 0) a += 2 * Math.PI;
      order.push([a, ui]);
    }
    order.sort(function(p, q2){ return p[0] - q2[0]; });

    for (var oi = 0; oi < order.length; oi++){
      drawStrand(cx, cy, ri, ro, u, order[oi][1], k, t, vScale);
    }

    drawHalos(cx, cy, ri, ro, u, vScale);
    drawBloom(cx, cy, ri, ro, u, vScale, k, t);
  }

  // ---------------- loop ----------------
  var raf = null;

  function tick(){
    var t = clockSeconds();
    ringFrame(t);
    updateTypewriter(t);
    raf = requestAnimationFrame(tick);
  }

  function start(){
    if (reducedMotion){
      ringFrame(0);
      updateTypewriter(0);
      return;
    }
    if (document.hidden) return;
    if (!raf) raf = requestAnimationFrame(tick);
  }

  function stop(){
    if (raf){ cancelAnimationFrame(raf); raf = null; }
  }

  document.addEventListener('visibilitychange', function(){
    if (document.hidden) stop(); else start();
  });

  window.addEventListener('resize', function(){
    computeDims();
    if (reducedMotion) ringFrame(0);
  });

  computeDims();
  start();
})();
</script>
</body>
</html>
